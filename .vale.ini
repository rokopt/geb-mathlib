StylesPath = styles

MinAlertLevel = suggestion

Packages = Google, write-good, Joblint, alex, proselint

[*.{md}]
# ^ This section applies to only Markdown files.
#
# You can change (or add) file extensions here
# to apply these settings to other file types.
#
# For example, to apply these settings to both
# Markdown and reStructuredText:
#
# [*.{md,rst}]
BasedOnStyles = Vale, Google, write-good, Joblint, alex, proselint

# Machine-emitted and vendored files are not authored documentation. The
# directories are those `.markdownlint-cli2.jsonc` ignores, so the two
# linters agree on what counts as scratch. The leading `{**/,}` alternative
# matches an absolute path, which is how an editor integration or a hook
# names the file it has just written.
[{**/,}{.lake,.jj,.remember,.superpowers,node_modules,styles}/**]
BasedOnStyles =
