name = "geb-mathlib"
defaultTargets = ["Geb", "GebLang"]
testDriver = "GebTests"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Geb"]

# Lean options registered by Lean core go in `leanOptions`; every other
# option, mathlib's linters among them, goes in `moreLeanArgs` (and
# `moreServerOptions`, which carries the same settings to the language
# server). Verso's literate module facet re-serialises `leanOptions` as
# `-D<name>=<value>` arguments to the verso-literate executable, whose
# option parser rejects a name the executable does not register and
# does not honour the `weak.` prefix that makes `lean` skip one; it
# parses those arguments before loading the module, so the module's own
# imports do not help. `moreLeanArgs` reach `lean` alone, which honours
# `weak.`, and never reach the facet, so every module of every library
# stays renderable by the literate pipeline
# (docs/rules/lean-coding.md § Literate modules).
#
# mathlib's linters, for every library and executable of the package.
moreLeanArgs = [
  "-Dweak.linter.mathlibStandardSet=true",
  "-Dweak.linter.flexible=true",
  "-Dweak.linter.style.header=true",
]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
warningAsError = true

[moreServerOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.style.header = true

# Pinned in lockstep with `lean-toolchain`; bump `rev` when bumping
# the toolchain version. Verso's tags are named after Lean
# toolchains; if a bump targets a toolchain Verso has not yet
# tagged, the bump waits for the tag (`update.yml` reports the
# failed update rather than committing it). Declared ahead of
# doc-gen4 and mathlib so that, under Lake's reverse-order root
# resolution, mathlib's plausible pin and doc-gen4's MD4Lean pin
# take precedence over verso's branch-pinned requires.
[[require]]
name = "verso"
scope = "leanprover"
rev = "v4.35.0-rc4"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.35.0-rc4"

# Canonical, a solver for type inhabitation (the Bootstrap chapter of the
# manual, § Search and synthesis), for experiments only: no module of `Geb`, `GebLang` or
# `GebTests` imports it, so a default build never fetches its solver
# library, which Lake downloads from a GitHub release named after a Lean
# version. It has no dependencies. `rev` follows Canonical's latest version
# tag, the only revisions with a solver being those a release tag names
# (the Bootstrap chapter records how a replaced release is refetched).
# `TODO.md` § Triggers records the condition for removing it.
[[require]]
name = "Canonical"
scope = "chasenorman"
rev = "v4.34.0"

# Pinned in lockstep with `lean-toolchain`; bump `rev` when bumping
# the toolchain version.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4.git"
rev = "v4.35.0-rc4"

# Declared last so mathlib's transitive dependency pins
# (plausible, importGraph) take precedence over other requires';
# reverse order makes lake's mathlib cache fetcher compute
# mismatched hashes against the warm cache. Mathlib's README
# documents this ordering rule for downstream projects.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc4"

[[lean_lib]]
name = "Geb"
globs = ["Geb.*"]

# The test library: its root and every module the root imports, but for
# the modules below that read files at elaboration.
[[lean_lib]]
name = "GebTests"

# `linter.hashCommand`, a member of `mathlibStandardSet`, rejects every
# `#`-command outside `#adaptation_note`. Its purpose is to keep them
# out of library code, where they print output and slow elaboration;
# `Geb` keeps the full set and so keeps that ban. Test modules assert
# by `#guard`, which is the only form available for values that do not
# reduce in the kernel — `Repr` rendering through `Std.Format.prettyM`,
# and well-founded recursions such as `UnionFind.find` — since `rfl`
# and `decide` both fail on those and `native_decide` is forbidden
# outright. mathlib draws the same line: its `lean_lib MathlibTest`
# carries no `leanOptions`, so `mathlibStandardSet` never reaches it.
# The entry below disables the one linter, an option of its own taking
# precedence over the set that would otherwise enable it; it is a
# mathlib option, so it goes in `moreLeanArgs` (see the note above the
# package options). The test libraries below repeat it.
moreLeanArgs = ["-Dweak.linter.hashCommand=false"]

[lean_lib.moreServerOptions]
weak.linter.hashCommand = false

# The test modules that compare Geb programs with Lean ones read the
# programs' sources at elaboration, by `include_str`, `IO.FS.readFile` or
# `geb_program`, none of which registers a dependency on the file read.
# Each library below holds the modules reading one group of sources, and
# its `needs` mixes the trace of those sources into the trace of its
# modules, so a change to a source rebuilds the modules that read it and
# their importers and no other test. A source a module reads that one of
# its imports already reads is covered by the import. Lake resolves a
# module to the last library declared that can build it, so these
# libraries follow `GebTests`, whose root covers every test module.
[[input_file]]
name = "preludeSource"
path = "bootstrap/prelude.geb"
text = true

[[input_file]]
name = "serializeSource"
path = "bootstrap/serialize.geb"
text = true

[[input_file]]
name = "readerSource"
path = "bootstrap/reader.geb"
text = true

[[input_file]]
name = "checkSource"
path = "bootstrap/check.geb"
text = true

[[input_file]]
name = "datatypeSource"
path = "bootstrap/datatype.geb"
text = true

[[input_file]]
name = "modulesSource"
path = "bootstrap/modules.geb"
text = true

[[input_file]]
name = "seqSource"
path = "bootstrap/seq.geb"
text = true

[[input_file]]
name = "substSource"
path = "bootstrap/subst.geb"
text = true

[[input_file]]
name = "recognizeSource"
path = "bootstrap/recognize.geb"
text = true

[[input_file]]
name = "compileSource"
path = "bootstrap/compile.geb"
text = true

[[input_file]]
name = "identitySource"
path = "bootstrap/identity.geb"
text = true

[[input_file]]
name = "printerSource"
path = "bootstrap/printer.geb"
text = true

[[input_file]]
name = "evalSource"
path = "bootstrap/eval.geb"
text = true

# The stage-1 compiler's sources in the datatype language.
[[input_dir]]
name = "stage1Sources"
path = "bootstrap/stage1"
text = true
filter = {extension = ["geb"]}

[[input_dir]]
name = "freeToposSources"
path = "bootstrap/free-topos"
text = true
filter = {extension = ["geb"]}

# The certificates of the internal language's developments, which tests read at elaboration
# (scripts/certificates.sh).
[[input_dir]]
name = "certificates"
path = "bootstrap/certificates"
text = true
filter = {extension = ["cert"]}

# The committed stage-1 compiler, which a test runs, read at elaboration.
[[input_file]]
name = "compilerImage"
path = "bootstrap/compiler.img"

# The stage-0 compiler's sources, and the traversal of kernel terms.
[[lean_lib]]
name = "GebTestsStage0"
globs = ["GebTests.Prototypes.Stage0"]
needs = ["@/preludeSource", "@/serializeSource", "@/readerSource", "@/checkSource",
  "@/datatypeSource", "@/modulesSource", "@/recognizeSource", "@/compileSource",
  "@/substSource"]
moreLeanArgs = ["-Dweak.linter.hashCommand=false"]

[lean_lib.moreServerOptions]
weak.linter.hashCommand = false

# The stage-1 compiler's image and its sources.
[[lean_lib]]
name = "GebTestsStage1"
globs = ["GebTests.Prototypes.Stage1"]
needs = ["@/compilerImage", "@/stage1Sources", "@/seqSource"]
moreLeanArgs = ["-Dweak.linter.hashCommand=false"]

[lean_lib.moreServerOptions]
weak.linter.hashCommand = false

# The metalogic's program and the printer it loads.
[[lean_lib]]
name = "GebTestsFreeTopos"
globs = ["GebTests.Prototypes.FreeTopos.Agreement.Load"]
needs = ["@/freeToposSources", "@/printerSource", "@/seqSource"]
moreLeanArgs = ["-Dweak.linter.hashCommand=false"]

[lean_lib.moreServerOptions]
weak.linter.hashCommand = false

# The benchmarks, run by `lake exe geb-bench` and by slow-checks.yml, and built by neither
# `lake build` nor `lake test`.
[[lean_lib]]
name = "GebBench"

# The developments of the internal language, each read from its certificate.
[[lean_lib]]
name = "GebTestsCertified"
globs = ["GebTests.Prototypes.FreeTopos.Certified.+"]
needs = ["@/certificates"]
moreLeanArgs = ["-Dweak.linter.hashCommand=false"]

[lean_lib.moreServerOptions]
weak.linter.hashCommand = false

# The hash, the printer and the evaluator of the kernel's terms.
[[lean_lib]]
name = "GebTestsKernel"
globs = ["GebTests.Prototypes.Kernel.Identity", "GebTests.Prototypes.Kernel.Printer",
  "GebTests.Prototypes.Kernel.Eval"]
needs = ["@/identitySource", "@/printerSource", "@/evalSource"]
moreLeanArgs = ["-Dweak.linter.hashCommand=false"]

[lean_lib.moreServerOptions]
weak.linter.hashCommand = false

[[lean_lib]]
name = "GebMeta"

# The Geb language, in Verso's literate style. `doc.verso` switches
# this library's docstrings to checked Verso markup, which both
# doc-gen4 and the literate pipeline render. A literate module of any
# other library sets the option itself, in the two-line form
# docs/rules/lean-coding.md § Literate modules gives; this library,
# every module of which is literate, takes it from here.
[[lean_lib]]
name = "GebLang"
globs = ["GebLang.*"]

[lean_lib.leanOptions]
doc.verso = true

# `GebManual.Bibliography` declares one entry per entry of
# docs/references.bib, which it reads at elaboration, registering no
# dependency on the file. The manual library's `needs` mixes the
# file's trace into the trace of every GebManual module, so an edit to
# the bibliography regenerates the entries and rebuilds the chapters
# that cite them.
[[input_file]]
name = "referencesBib"
path = "docs/references.bib"
text = true

# The Verso manual: document library and generator executable,
# with sources under manual/. Excluded from defaultTargets and the
# test driver, so lake build, lake test, and the default lake lint
# compile nothing new; scripts/manual.sh build (run by
# doc-build.yml in CI) is the only builder. linter.hashCommand is
# disabled because #doc, the Verso document command, is the
# library's content; verso.code.warnLineLength widens Verso's
# code-line warning to the repository's line width. Neither option
# is registered by Lean core, so both go in `moreLeanArgs` (see the
# note above the package options).
[[lean_lib]]
name = "GebManual"
srcDir = "manual"
needs = ["@/referencesBib"]
moreLeanArgs = [
  "-Dweak.verso.code.warnLineLength=100",
  "-Dweak.linter.hashCommand=false",
]

[lean_lib.moreServerOptions]
weak.verso.code.warnLineLength = 100
weak.linter.hashCommand = false

# The Lean the bootstrap compiler emits from its own source, a committed
# build artifact regenerated by scripts/bootstrap.sh (the manual's
# Bootstrap chapter, Speed and a second host). The file is generated, so
# mathlib's linters, which ask for a copyright header naming its authors,
# are off.
[[lean_lib]]
name = "GebBoot"
srcDir = "bootstrap/lean"
moreLeanArgs = [
  "-Dweak.linter.mathlibStandardSet=false",
  "-Dweak.linter.flexible=false",
  "-Dweak.linter.style.header=false",
]

[lean_lib.moreServerOptions]
weak.linter.mathlibStandardSet = false
weak.linter.flexible = false
weak.linter.style.header = false

# The Lean the bootstrap compiler emits from the programs whose agreement
# with a Lean function is proved, committed build artifacts regenerated by
# scripts/bootstrap.sh; generated, as GebBoot is, one module per program under
# bootstrap/lean/GebMirror/, which the root module imports. The metalogic's is a
# module per layer of its program, beside the generated loading of the program
# through each layer (GebMirror.Metalogic.Load).
[[lean_lib]]
name = "GebMirror"
srcDir = "bootstrap/lean"
moreLeanArgs = [
  "-Dweak.linter.mathlibStandardSet=false",
  "-Dweak.linter.flexible=false",
  "-Dweak.linter.style.header=false",
]

[lean_lib.moreServerOptions]
weak.linter.mathlibStandardSet = false
weak.linter.flexible = false
weak.linter.style.header = false

[[lean_exe]]
name = "sexpr"
root = "SexprMain"

[[lean_exe]]
name = "rosebench"
root = "RoseBenchMain"

[[lean_exe]]
name = "geb-kernel"
root = "GebKernelMain"

[[lean_exe]]
name = "geb-compile"
root = "GebCompileMain"

[[lean_exe]]
name = "geb-defs"
root = "GebDefsMain"

[[lean_exe]]
name = "geb-fmt"
root = "GebFmtMain"

[[lean_exe]]
name = "geb-certify"
root = "GebCertifyMain"

[[lean_exe]]
name = "geb-bench"
root = "GebBenchMain"

[[lean_exe]]
name = "geb-manual"
srcDir = "manual"
root = "Main"
supportInterpreter = true

# Experiments with Canonical (the manual's Bootstrap chapter, § Search and
# synthesis): a library that no module of `Geb`, `GebLang` or `GebTests`
# imports, and the programs that run it, which give the solver problems
# and check the terms it returns with Geb's checkers.
[[lean_lib]]
name = "GebExperiments"
globs = ["GebExperiments.*"]

[[lean_exe]]
name = "lf-canonical"
root = "GebExperiments.LF.Main"
