# efm-langserver configuration for Geb files: the diagnostics of
# `geb-author check`, published when a buffer is saved.
#
#   efm-langserver -c editors/efm-langserver/config.yaml
#
# The command reads files from disk. For a source of a program it compiles
# the sources of the nearest manifest that lists the saved file, up to that
# file, or the file alone where no manifest lists it. For a proof document
# it proves the document, after those it imports, against the program the
# document names. It therefore runs on save and not on each change.
# The first format reads a diagnostic at an occurrence,
# FILE:LINE:COLUMN: error: MESSAGE, and the second a failure without one,
# FILE: MESSAGE.
version: 2
root-markers:
  - lakefile.toml
tools:
  geb-author-check: &geb-author-check
    lint-command: 'lake exe geb-author check ${INPUT}'
    lint-stdin: false
    lint-on-save: true
    lint-source: 'geb-author'
    lint-formats:
      - '%f:%l:%c: %trror: %m'
      - '%f: %m'
languages:
  geb:
    - <<: *geb-author-check
