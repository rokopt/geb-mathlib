name: Slow checks

# The checks too slow for every push, daily and on demand: the checks
# too slow to build with the tests, the library GebSlow; and the
# benchmarks, which measure and do not check
# (docs/rules/ci-and-workflow.md § Benchmarks).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: Build and lint the slow checks
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6  # v1
        with:
          build: false
          test: false
          lint: false
      - name: lake build GebSlow
        run: lake build GebSlow
      - name: lint GebSlow
        run: lake exe batteries/runLinter GebSlow

  bench:
    name: Run the benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6  # v1
        with:
          build: false
          test: false
          lint: false
      # The benchmarks' executable reads the stored certificates when it
      # starts, which recurses deeper than the default stack allows, so it
      # runs with the stack limit raised to the hard limit, as
      # scripts/certificates.sh runs the generator.
      - name: lake exe geb-bench
        run: |
          ulimit -s "$(ulimit -Hs)"
          lake exe geb-bench
