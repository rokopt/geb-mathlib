name: Slow checks

# The checks too slow for every push, run daily and on demand: the loading
# of the metalogic's program in the loading mode rfl, every fact of it
# checked by the kernel, which the other workflows build in the mode
# native (docs/rules/ci-and-workflow.md § Loading modes); and the
# regeneration of the certificates of the internal language's
# developments, compared with the committed ones, and the checks of the
# certificates too slow to build with the tests (§ Certificates); and the
# benchmarks (§ Benchmarks).
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rfl:
    name: Build and lint GebTests in the loading mode rfl
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      GEB_LOADING: rfl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The GitHub cache would restore modules built in the mode native,
      # which Lake would not rebuild, the mode being no input it tracks.
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865  # v1
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
      - name: lake build GebTests
        run: lake build GebTests
      # In the mode rfl the axiom linter permits no axiom of the loading.
      - name: lint GebTests
        run: lake exe batteries/runLinter GebTests

  searches:
    name: List the searches of the certificates
    runs-on: ubuntu-latest
    timeout-minutes: 720
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865  # v1
        with:
          build: false
          test: false
          lint: false
      - id: list
        name: scripts/certificates.sh searches
        run: |
          names=$(bash scripts/certificates.sh searches | jq -Rnc '[inputs]')
          echo "names=$names" >> "$GITHUB_OUTPUT"

  # One job to a search, so that each runs within the hosted runners'
  # limit on a job's time; a search reads the committed certificates it
  # continues from.
  certificates:
    name: Regenerate and compare the certificates of ${{ matrix.search }}
    needs: searches
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        search: ${{ fromJSON(needs.searches.outputs.names) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865  # v1
        with:
          build: false
          test: false
          lint: false
      - name: scripts/certificates.sh check ${{ matrix.search }}
        run: bash scripts/certificates.sh check "${{ matrix.search }}"

  certified:
    name: Build and lint the slow checks of the certificates
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865  # v1
        with:
          build: false
          test: false
          lint: false
      - name: lake build GebSlow
        run: lake build GebSlow
      - name: lint GebSlow
        run: lake exe batteries/runLinter GebSlow

  bench:
    name: Run the benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865  # v1
        with:
          build: false
          test: false
          lint: false
      - name: lake exe geb-bench
        run: lake exe geb-bench
