name: Doc build

on:
  schedule:
    - cron: '0 9 1 * *'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6  # v1
        with:
          build: true
          test: false
          lint: false
      # doc-gen4 links a dependency's C sources (leansqlite's bundled
      # SQLite), whose compiler warnings Lake logs at its informational
      # level; warnings and errors of this repository's Lean, compiled
      # by the step above at the default level, stay visible.
      - run: lake build Geb:docs --log-level=warning
      - run: lake build GebLang:docs --log-level=warning
      - name: Upload generated documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: geb-docs
          path: .lake/build/doc
          if-no-files-found: error
      - run: bash scripts/manual.sh build
      - name: Upload the generated manual
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: geb-manual
          path: manual/_out/html-multi
          if-no-files-found: error
      - run: bash scripts/literate.sh build
      - name: Locate the generated literate site
        run: |
          site="$(lake query :literateHtml)"
          echo "LITERATE_HTML=$site" >> "$GITHUB_ENV"
      - name: Upload the generated literate site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: geb-literate
          path: ${{ env.LITERATE_HTML }}
          if-no-files-found: error
