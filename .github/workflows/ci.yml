name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      searches:
        description: Run every search, whether or not its inputs have passed
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/integration' }}

# Jobs build and run pull-request-supplied code (lakefiles,
# elaboration); restrict the token to read so untrusted PR content
# cannot use a write-capable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  floodgate_imports:
    name: Floodgate imports lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # lint-imports.sh enforces the bare-umbrella-import ban (Rule 1)
      # among other subtree rules; a separate grep job would duplicate
      # it.
      - name: scripts/lint-imports.sh
        run: bash scripts/lint-imports.sh
      - name: scripts/tests/test-lint-imports.sh
        run: bash scripts/tests/test-lint-imports.sh
      - name: scripts/tests/test-extract-pr.sh
        run: bash scripts/tests/test-extract-pr.sh
      - name: scripts/tests/test-check-commit-msg.sh
        run: bash scripts/tests/test-check-commit-msg.sh

  commit_message_lint:
    name: Commit message convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the pull request's commit subjects
        run: |
          git log --no-merges --format='%s' "${BASE}..${HEAD}" \
            | bash scripts/check-commit-msg.sh
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  build:
    name: Build / test / lint / shake
    runs-on: ubuntu-latest
    # A build with no cache to restore compiles the test library in
    # full, which takes longer than an hour; lean-action saves the cache
    # only after its build step completes, so a limit below that time
    # leaves every later run without a cache. 360 minutes is the limit
    # GitHub-hosted runners allow.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64  # v1
        with:
          build: true
          # `defaultTargets` (Geb) and the test library.
          # lean-action saves the GitHub cache of `.lake` after its
          # build step and before `lake test`, so a test module built
          # by the build step is cached and is rebuilt by a later run
          # only when its inputs change.
          build-args: Geb GebTests
          test: true
          lint: true
          # Everything builds via the `Geb.*`/`GebTests.*`
          # globs rather than a root import list, and bulk imports are
          # arranged per subdirectory; there is no flat root
          # aggregator for mk_all to check.
          mk_all-check: false
      # The parinfer release whose fixed points the bootstrap's check
      # tests, from scripts/parinfer/package-lock.json.
      - name: install parinfer
        run: npm ci --prefix scripts/parinfer
      # The bootstrap's committed image and emitted Lean regenerate
      # byte for byte, the compiled compiler reproduces both, and the
      # sources are fixed points of geb-fmt and of parinfer.
      - name: bootstrap fixed points
        run: bash scripts/bootstrap.sh check
      - name: recorded Geb development and authoring tests
        run: |
          bash scripts/authoring.sh check
          bash scripts/tests/test-authoring.sh
          bash scripts/tests/test-preservation.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
      - name: install editor test dependencies
        run: npm ci --prefix editors/vscode
      - name: Geb language, formatter and Paredit tests
        run: xvfb-run -a bash scripts/tests/test-editor.sh
      - name: lint GebTests (axiom + style linters on tests)
        run: lake exe batteries/runLinter GebTests
      - name: scripts/tests/test-axiom-linter.sh
        run: bash scripts/tests/test-axiom-linter.sh
      - name: scripts/tests/test-lint-driver.sh
        run: bash scripts/tests/test-lint-driver.sh
      - name: lake shake (minimised imports)
        run: lake shake --add-public --keep-implied --keep-prefix Geb GebTests
      - name: scripts/tests/test-lake-shake.sh
        run: bash scripts/tests/test-lake-shake.sh

  # The generator of the certificates, built once for the jobs of the
  # searches, and the searches' names.
  certify:
    name: Build the generator of the certificates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64  # v1
        with:
          build: false
          test: false
          lint: false
      - name: lake build geb-certify
        run: lake build geb-certify
      - id: list
        name: scripts/certificates.sh searches
        run: |
          names=$(bash scripts/certificates.sh searches | jq -Rnc '[inputs]')
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: geb-certify
          path: .lake/build/bin/geb-certify
          retention-days: 1

  # The regeneration of the certificates of the internal language's
  # developments, compared with the committed ones
  # (docs/rules/ci-and-workflow.md § Certificates): one job to a search,
  # so that each runs within the hosted runners' limit on a job's time; a
  # search reads the committed certificates it continues from.
  certificates:
    name: Regenerate and compare the certificates of ${{ matrix.search }}
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        search: ${{ fromJSON(needs.certify.outputs.names) }}
    env:
      GEB_CERTIFY: bin/geb-certify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: geb-certify
          path: bin
      # An artifact keeps no file mode.
      - name: chmod +x bin/geb-certify
        run: chmod +x bin/geb-certify
      # A search's certificates are a function of the generator's compiled
      # code and of the committed certificates it reads, so a search that
      # passed with the same executable and certificates is not run again.
      # The key names the executable by its bytes, which a change that
      # alters no compiled code leaves unchanged.
      - id: key
        name: Compute the key of the search's inputs
        run: |
          exe=$(sha256sum bin/geb-certify | cut -d ' ' -f 1)
          certs=${{ hashFiles('bootstrap/certificates/*.cert', 'scripts/certificates.sh') }}
          echo "key=search-${{ matrix.search }}-$exe-$certs" >> "$GITHUB_OUTPUT"
      - id: passed
        name: Look up a passing run at the key
        if: ${{ !inputs.searches }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: search-passed
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: scripts/certificates.sh check ${{ matrix.search }}
        if: steps.passed.outputs.cache-hit != 'true'
        run: |
          bash scripts/certificates.sh check "${{ matrix.search }}"
          echo "${{ steps.key.outputs.key }}" > search-passed
      - name: Record the passing run at the key
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: search-passed
          key: ${{ steps.key.outputs.key }}

  hooks_test:
    name: Hooks smoke test
    runs-on: ubuntu-latest
    # jq is preinstalled on ubuntu-latest runners; no explicit install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: scripts/hooks/tests/test-block-mutating-git.sh
        run: bash scripts/hooks/tests/test-block-mutating-git.sh

  regenerate_guard_test:
    name: Integration regeneration guard test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned jj
        run: bash scripts/install-jj.sh
      - name: scripts/tests/test-regenerate-integration.sh
        run: bash scripts/tests/test-regenerate-integration.sh
      - name: scripts/tests/test-diff-against-main.sh
        run: bash scripts/tests/test-diff-against-main.sh
      - name: scripts/tests/test-vcs.sh
        run: bash scripts/tests/test-vcs.sh

  bump_detect_tests:
    name: Bump detect-script tests
    runs-on: ubuntu-latest
    # jq is preinstalled on ubuntu-latest runners; no explicit install.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: scripts/tests/test-mathlib-bump-detect.sh
        run: bash scripts/tests/test-mathlib-bump-detect.sh
      - name: scripts/tests/test-jj-bump-detect.sh
        run: bash scripts/tests/test-jj-bump-detect.sh
