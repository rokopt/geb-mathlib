name: Markdown lint

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
          config: '.markdownlint-cli2.jsonc'
      - name: Install pinned jj
        run: bash scripts/install-jj.sh
      - name: scripts/check-md-links.sh
        run: bash scripts/check-md-links.sh
      - name: scripts/tests/test-check-md-links.sh
        run: bash scripts/tests/test-check-md-links.sh
